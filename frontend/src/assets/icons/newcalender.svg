<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 120 120" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
  <!-- Calendar outline -->
  <rect x="30" y="30" width="60" height="60" rx="6" ry="6" />
  <!-- Calendar header -->
  <rect x="30" y="20" width="60" height="20" rx="4" ry="4" />
  <!-- Rings -->
  <line x1="45" y1="10" x2="45" y2="30" />
  <line x1="75" y1="10" x2="75" y2="30" />
  <!-- Grid lines -->
  <line x1="30" y1="50" x2="90" y2="50" />
  <line x1="30" y1="65" x2="90" y2="65" />
  <line x1="30" y1="80" x2="90" y2="80" />
  <line x1="50" y1="30" x2="50" y2="90" />
  <line x1="70" y1="30" x2="70" y2="90" />
  <!-- Text box -->
  <rect x="40" y="95" width="40" height="20" stroke="white" fill="none" rx="4" ry="4" />
  <!-- Text "CAL" inside box -->
  <text x="60" y="108" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="600" dominant-baseline="middle" text-anchor="middle">
    CAL
  </text>
</svg>
